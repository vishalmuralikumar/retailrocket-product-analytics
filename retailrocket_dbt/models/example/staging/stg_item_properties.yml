          - not_null

      - name: property
        data_tests:
          - not_null

      - name: property_value
        data_tests:
          - not_null

      - name: source_file
        data_tests:
          - not_null

      - name: source_row_number
        data_tests:
          - not_null

      - name: ingested_at
        data_tests:
          - not_null