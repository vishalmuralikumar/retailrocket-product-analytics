version: 2

models:
  - name: dim_categories
    description: >
      One row per category found in the category tree or enriched events.
      Labels are generated from IDs because category names are unavailable.
      Parent relationships reflect the supplied category tree.

    columns:
      - name: category_id
        data_tests:
          - not_null
          - unique

      - name: category_label
        data_tests:
          - not_null

      - name: exists_in_category_tree
        data_tests:
          - not_null

      - name: parent_category_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_categories')
                field: category_id