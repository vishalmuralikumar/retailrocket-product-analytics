version: 2

models:
  - name: dim_dates
    description: >
      One row per calendar date between the earliest and latest
      observed event dates in UTC.

    columns:
      - name: date_day
        data_tests:
          - not_null
          - unique

      - name: calendar_year
        data_tests:
          - not_null

      - name: year_month
        data_tests:
          - not_null

      - name: iso_day_of_week
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [1, 2, 3, 4, 5, 6, 7]
                quote: false