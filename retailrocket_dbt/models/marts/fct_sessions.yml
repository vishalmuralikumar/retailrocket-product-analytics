version: 2

models:
  - name: fct_sessions
    description: >
      One row per derived session using a 30-minute inactivity rule.
      Session dates and timestamps use UTC.

    columns:
      - name: session_id
        data_tests:
          - not_null
          - unique

      - name: visitor_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('int_visitors')
                field: visitor_id

      - name: session_date
        data_tests:
          - not_null

      - name: session_start_at_utc
        data_tests:
          - not_null

      - name: session_end_at_utc
        data_tests:
          - not_null

      - name: observed_duration_seconds
        data_tests:
          - not_null

      - name: total_event_count
        data_tests:
          - not_null

      - name: has_purchase
        data_tests:
          - not_null